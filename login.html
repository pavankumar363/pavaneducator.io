<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavan Educator - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f5f9;
    }

    .login-box {
      width: 370px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1e3a8a;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
      color: #666;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1e3a8a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #172554;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #555;
    }

    .switch a {
      color: #1e3a8a;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Pavan Educator</h1>

    <p class="subtitle" id="formTitle">Student Login</p>

    <!-- LOGIN FORM -->
    <form id="loginForm">

      <label for="loginEmail">Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
      >

      <label for="loginPassword">Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>

      <p class="switch">
        Don't have an account?
        <a id="showSignup">Create Account</a>
      </p>

      <p id="loginMessage" class="message error"></p>

    </form>


    <!-- SIGN UP FORM -->
    <form id="signupForm" style="display:none;">

      <label for="signupEmail">Email</label>
      <input
        type="email"
        id="signupEmail"
        placeholder="Enter your email"
        required
      >

      <label for="signupPassword">Password</label>
      <input
        type="password"
        id="signupPassword"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <button type="submit">Create Account</button>

      <p class="switch">
        Already have an account?
        <a id="showLogin">Login</a>
      </p>

      <p id="signupMessage" class="message"></p>

    </form>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // YOUR SUPABASE PROJECT
    const SUPABASE_URL =
      "https://pavankumar363.github.io/pavaneducator.io.supabase.co";

    // PASTE YOUR SUPABASE PUBLISHABLE KEY BETWEEN THE QUOTES
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_XcpTSrNn3CAfaEj-AoOHmw_kjciLd7Z";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // GET ELEMENTS
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const showSignup = document.getElementById("showSignup");
    const showLogin = document.getElementById("showLogin");

    const formTitle = document.getElementById("formTitle");

    const loginMessage = document.getElementById("loginMessage");
    const signupMessage = document.getElementById("signupMessage");


    // SHOW SIGNUP
    showSignup.addEventListener("click", function() {

      loginForm.style.display = "none";
      signupForm.style.display = "block";

      formTitle.textContent = "Create Your Account";

      loginMessage.style.display = "none";
      signupMessage.style.display = "none";

    });


    // SHOW LOGIN
    showLogin.addEventListener("click", function() {

      signupForm.style.display = "none";
      loginForm.style.display = "block";

      formTitle.textContent = "Student Login";

      loginMessage.style.display = "none";
      signupMessage.style.display = "none";

    });


    // CREATE ACCOUNT
    signupForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      signupMessage.className = "message";
      signupMessage.style.display = "block";
      signupMessage.textContent = "Creating your account...";

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });


      if (error) {

        signupMessage.className = "message error";
        signupMessage.textContent = error.message;

        return;
      }


      signupMessage.className = "message success";

      if (data.session) {

        signupMessage.textContent =
          "Account created! Opening dashboard...";

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 1000);

      } else {

        signupMessage.textContent =
          "Account created! Please check your email to confirm your account.";

      }

    });


    // LOGIN
    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      loginMessage.className = "message";
      loginMessage.style.display = "block";
      loginMessage.textContent = "Logging in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        loginMessage.className = "message error";
        loginMessage.textContent =
          "Login failed: " + error.message;

        return;
      }


      loginMessage.className = "message success";
      loginMessage.textContent =
        "Login successful! Opening dashboard...";


      setTimeout(function() {
        window.location.href = "dashboard.html";
      }, 700);

    });

  </script>

</body>
</html>
