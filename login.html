<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavan Educator - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f5f9;
    }

    .login-box {
      width: 350px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1e3a8a;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
      color: #666;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1e3a8a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #172554;
    }

    #error {
      display: none;
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Pavan Educator</h1>
    <p class="subtitle">Student Login</p>

    <form id="loginForm">

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">Login</button>

      <p id="error">Invalid username or password</p>

    </form>
  </div>

  <script>
    const correctUsername = "educator";
    const correctPassword = "pavan";

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (username === correctUsername && password === correctPassword) {
        window.location.href = "dashboard.html";
      } else {
        error.style.display = "block";
      }
    });
  </script>

</body>
</html>
