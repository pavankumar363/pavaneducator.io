<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavan Educator - Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #1e3a8a;
      color: white;
      padding: 25px 15px;
    }

    .logo {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 14px 15px;
      margin-bottom: 8px;
      border-radius: 8px;
    }

    .menu a:hover,
    .menu a.active {
      background: #172554;
    }

    .main {
      margin-left: 240px;
      padding: 35px;
    }

    h1 {
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .profile-card {
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .avatar {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      border-radius: 50%;
      background: #1e3a8a;
      color: white;
      font-size: 35px;
      font-weight: bold;
    }

    .info {
      margin-bottom: 20px;
    }

    .info strong {
      display: block;
      margin-bottom: 6px;
      color: #333;
    }

    .info span {
      color: #666;
    }

    @media (max-width: 600px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      Pavan Educator
    </div>

    <nav class="menu">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="projects.html">📁 My Projects</a>
      <a href="notifications.html">🔔 Notifications</a>
      <a href="profile.html" class="active">👤 Profile</a>
      <a href="visitor-login.html">👥 Visitor Login</a>
      <a href="index.html">🚪 Logout</a>
    </nav>

  </aside>

  <main class="main">

    <h1>My Profile</h1>
    <p class="subtitle">View your account information.</p>

    <section class="profile-card">

      <div class="avatar">P</div>

      <div class="info">
        <strong>Name</strong>
        <span>Pavan</span>
      </div>

      <div class="info">
        <strong>Username</strong>
        <span>pavan</span>
      </div>

      <div class="info">
        <strong>Website</strong>
        <span>Pavan Educator</span>
      </div>

      <div class="info">
        <strong>Account Type</strong>
        <span>Student</span>
      </div>

    </section>

  </main>

</body>
</html>
